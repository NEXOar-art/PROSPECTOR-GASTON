<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Dashboard Leads Zonas Varias + Paraguay | NEXO-ART</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: linear-gradient(135deg, #f0f4f8 0%, #e6f0fa 100%);
    color: #2c3e50;
    min-height: 100vh;
    padding: 12px;
  }
  .header {
    background: linear-gradient(135deg, #00B4D8 0%, #0077B6 100%);
    color: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,119,182,0.25);
    margin-bottom: 16px;
  }
  .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }

    background: rgba(255,255,255,0.2);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 10px;
    backdrop-filter: blur(10px);

  .exchange-rate-container {
    background: linear-gradient(135deg, #FFD93D 0%, #FF9F1C 100%);
    padding: 16px;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(255,159,28,0.3);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    color: #2c3e50;
  }
  .exchange-rate-container .label-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .exchange-rate-container .icon { font-size: 24px; }
  .exchange-rate-container .title { font-size: 14px; font-weight: 700; }
  .exchange-rate-container .sub { font-size: 11px; opacity: 0.85; }
  .exchange-rate-container input {
    width: 110px;
    padding: 8px 10px;
    border: 3px solid white;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    background: white;
    color: #2c3e50;
    outline: none;
    transition: all 0.2s;
  }
  .exchange-rate-container input:focus {
    box-shadow: 0 0 0 3px rgba(255,255,255,0.5);
    transform: scale(1.02);
  }
  .exchange-rate-container .currency-display {
    background: rgba(255,255,255,0.3);
    padding: 6px 12px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 12px;
    backdrop-filter: blur(10px);
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: white;
    padding: 16px;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    border-left: 5px solid;
    transition: transform 0.2s;
  }
  .kpi-card:hover { transform: translateY(-2px); }
  .kpi-card.blue { border-color: #00B4D8; }
  .kpi-card.green { border-color: #06D6A0; }
  .kpi-card.orange { border-color: #FF9F1C; }
  .kpi-card.pink { border-color: #EF476F; }
  .kpi-card.purple { border-color: #9D4EDD; }
  .kpi-card.red { border-color: #E63946; }
  .kpi-label { font-size: 10px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .kpi-value { font-size: 22px; font-weight: 700; margin-top: 4px; color: #2c3e50; }
  .kpi-sub { font-size: 11px; color: #95a5a6; margin-top: 2px; }

  .total-card {
    background: linear-gradient(135deg, #E63946 0%, #9D4EDD 50%, #0077B6 100%);
    color: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 10px 32px rgba(230,57,70,0.35);
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .total-card::before {
    content: "";
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .total-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
    position: relative;
    z-index: 2;
  }
  .total-card-header h2 {
    font-size: 17px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.3;
  }
  .total-card-header .badge {
    background: rgba(255,255,255,0.25);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    backdrop-filter: blur(10px);
    white-space: nowrap;
  }
  .total-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    position: relative;
    z-index: 2;
  }
  .total-item {
    background: rgba(255,255,255,0.15);
    padding: 14px;
    border-radius: 12px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .total-item .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.9;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .total-item .value {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.1;
    word-break: break-word;
  }
  .total-item .detail {
    font-size: 10px;
    opacity: 0.85;
    margin-top: 3px;
  }
  .total-item.highlight {
    background: rgba(255,255,255,0.95);
    color: #2c3e50;
    border: 2px solid #FFD93D;
  }
  .total-item.highlight .value {
    color: #E63946;
    font-size: 22px;
  }
  .total-item.highlight .label { color: #7f8c8d; }

  .info-card {
    background: linear-gradient(135deg, #06D6A0 0%, #00B4D8 100%);
    color: white;
    padding: 18px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(6,214,160,0.25);
    margin-bottom: 16px;
  }
  .info-card h3 { font-size: 16px; margin-bottom: 12px; }
  .benefits-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .benefit-item {
    background: rgba(255,255,255,0.2);
    padding: 10px 12px;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    font-size: 12px;
    line-height: 1.5;
  }
  .benefit-item strong { display: block; margin-bottom: 3px; font-size: 13px; }

  .pricing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .plan-card {
    background: rgba(255,255,255,0.2);
    padding: 12px;
    border-radius: 10px;
    backdrop-filter: blur(10px);
  }
  .plan-card.popular {
    background: rgba(255,255,255,0.35);
    border: 2px solid #FFD93D;
    position: relative;
  }
  .plan-card.popular::before {
    content: "⭐ MÁS VENDIDO";
    position: absolute;
    top: -10px;
    right: 10px;
    background: #FFD93D;
    color: #2c3e50;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
  }
  .plan-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .plan-price { font-size: 20px; font-weight: 800; margin-bottom: 3px; }
  .plan-maintenance {
    display: inline-block;
    background: rgba(255,255,255,0.3);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .plan-desc { font-size: 11px; opacity: 0.95; line-height: 1.5; }
  .addon {
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    font-size: 12px;
  }
  .payment-methods {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 2px dashed rgba(255,255,255,0.4);
    font-size: 12px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .table-container {
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .table-header {
    padding: 14px 16px;
    background: #f8fafc;
    border-bottom: 2px solid #e0e6ed;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .table-header h3 { font-size: 14px; color: #2c3e50; }
  .table-count {
    background: #00B4D8;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 1050px; }
  thead {
    background: linear-gradient(135deg, #0077B6 0%, #00B4D8 100%);
    color: white;
  }
  th {
    padding: 10px 6px;
    text-align: center;
    font-weight: 600;
    font-size: 9px;

    letter-spacing: 0.3px;

  th:nth-child(2) { text-align: left; }

  tbody tr { transition: background 0.15s; }

  tbody tr.potential td:first-child { border-left: 4px solid #06D6A0; }

  .wa-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #25D366;
    color: white;
    padding: 6px 10px;
    border-radius: 20px;

    font-weight: 600;

  .city-badge {
    display: inline-block;

  .city-badge:hover::after {

    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;

  .city-badge:hover::before {

  .city-lujan { background: #e0f4ff; color: #0077B6; }

  .skill-btn {
    background: white;
    border: 2px solid #9D4EDD;
